name: Quiet Night release build
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned release
        working-directory: android
        run: ./gradlew :app:assembleFdroidRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-night-unsigned-release
          path: android/app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
