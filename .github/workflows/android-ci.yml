name: Quiet Night Android CI
on:
  push:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/android-ci.yml' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run regression tests
        working-directory: android
        run: ./gradlew :app:assembleFdroidDebug :app:testFdroidDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-night-debug
          path: android/app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            android/app/build/reports/tests/testFdroidDebugUnitTest/
            android/app/build/reports/screenshots/
          if-no-files-found: ignore
